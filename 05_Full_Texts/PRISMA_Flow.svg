  <text x="892" y="103.84" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#281e3c">Records removed (N = 1,441)</text>
  <text x="892" y="137.52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#46375f">Duplicate records (n = 1,441)</text>
  <rect x="860" y="238" width="700" height="166" rx="14" fill="#f2e9fa" stroke="#6e5096" stroke-width="2"/>
  <text x="892" y="297.84" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#281e3c">Records set aside as lower quality (N = 2,453)</text>
  <text x="892" y="331.52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#46375f">First quality pass set aside (n = 2,573)</text>
  <text x="892" y="355.52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#46375f">Reintroduced after CORE verification (n = 120)</text>
  <rect x="860" y="456" width="700" height="238" rx="14" fill="#f2e9fa" stroke="#6e5096" stroke-width="2"/>
  <text x="892" y="515.84" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#281e3c">Records not retained (N = 506)</text>
  <text x="892" y="549.52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#46375f">Excluded at title screening (n = 193)</text>
  <text x="892" y="573.52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#46375f">Excluded at abstract screening (n = 141)</text>
  <text x="892" y="597.52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#46375f">No abstract available for scoring (n = 36)</text>
  <text x="892" y="621.52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#46375f">Uncertain relevance (n = 4)</text>
  <text x="892" y="645.52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#46375f">Relevant but outside the top 100 (reserve) (n = 132)</text>
  <rect x="860" y="746" width="700" height="166" rx="14" fill="#f2e9fa" stroke="#6e5096" stroke-width="2"/>
  <text x="892" y="805.84" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#281e3c">Full texts unavailable for coding (N = 29)</text>
  <text x="892" y="839.52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#46375f">No open full text under retrieval conditions (n = 28)</text>
  <text x="892" y="863.52" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#46375f">Open source location access denied (n = 1)</text>
