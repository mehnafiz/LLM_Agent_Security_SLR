  <text x="424.0" y="297.84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#281e3c">Records screened for quality (N = 3,059)</text>
  <text x="424.0" y="331.52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#46375f">First quality pass retained (n = 486)</text>
  <text x="424.0" y="355.52" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#46375f">Added after CORE rank verification (n = 120)</text>
  <rect x="84" y="456" width="680" height="238" rx="14" fill="#f2e9fa" stroke="#6e5096" stroke-width="2"/>
  <text x="424.0" y="582.84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#281e3c">Records screened by title and abstract (N = 606)</text>
  <rect x="84" y="746" width="680" height="166" rx="14" fill="#f2e9fa" stroke="#6e5096" stroke-width="2"/>
  <text x="424.0" y="836.84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#281e3c">Final set sought for full-text retrieval (N = 100)</text>
