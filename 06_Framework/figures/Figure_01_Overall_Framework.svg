<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860">
<rect width="1320" height="860" fill="#ffffff"/>
<style>text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#1A2332"/></marker><marker id="bl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#2B6CB0"/></marker><marker id="pu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#6B46C1"/></marker><marker id="rd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#C53030"/></marker><marker id="gn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#276749"/></marker></defs>
<rect x="0" y="0" width="1320" height="40" rx="0" fill="#1B365D" stroke="#1B365D" stroke-width="1.5"/><text x="16" y="26" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Fig. 1.   AgentShield-LCE — overall framework</text><rect x="16" y="56" width="250" height="788" rx="8" fill="#FFF6EA" stroke="#E09A2B" stroke-width="1.5"/><text x="32" y="84" font-size="16" font-weight="700" fill="#1A2332" text-anchor="start">Inputs</text><rect x="32" y="108" width="218" height="96" rx="8" fill="#ffffff" stroke="#E09A2B" stroke-width="1.5"/><rect x="46" y="126" width="14" height="16" rx="2" fill="none" stroke="#C05621" stroke-width="1.4"/><path d="M49 131 H57 M49 134 H57 M49 137 H54" stroke="#C05621" stroke-width="1.1"/><text x="72" y="144" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Paired cases</text><text x="72" y="166" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">Benign and attack</text><rect x="32" y="238" width="218" height="96" rx="8" fill="#ffffff" stroke="#E09A2B" stroke-width="1.5"/><rect x="46" y="256" width="14" height="16" rx="2" fill="none" stroke="#C05621" stroke-width="1.4"/><path d="M49 261 H57 M49 264 H57 M49 267 H54" stroke="#C05621" stroke-width="1.1"/><text x="72" y="274" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Agent and tools</text><text x="72" y="296" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">Model and registry</text><rect x="32" y="368" width="218" height="96" rx="8" fill="#ffffff" stroke="#E09A2B" stroke-width="1.5"/><rect x="46" y="386" width="14" height="16" rx="2" fill="none" stroke="#C05621" stroke-width="1.4"/><path d="M49 391 H57 M49 394 H57 M49 397 H54" stroke="#C05621" stroke-width="1.1"/><text x="72" y="404" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Memory</text><text x="72" y="426" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">Or a written waiver</text><rect x="32" y="498" width="218" height="96" rx="8" fill="#ffffff" stroke="#E09A2B" stroke-width="1.5"/><rect x="46" y="516" width="14" height="16" rx="2" fill="none" stroke="#C05621" stroke-width="1.4"/><path d="M49 521 H57 M49 524 H57 M49 527 H54" stroke="#C05621" stroke-width="1.1"/><text x="72" y="534" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Permissions</text><text x="72" y="556" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">Or one level stated</text><rect x="32" y="628" width="218" height="96" rx="8" fill="#ffffff" stroke="#E09A2B" stroke-width="1.5"/><rect x="46" y="646" width="14" height="16" rx="2" fill="none" stroke="#C05621" stroke-width="1.4"/><path d="M49 651 H57 M49 654 H57 M49 657 H54" stroke="#C05621" stroke-width="1.1"/><text x="72" y="664" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Checks</text><text x="72" y="686" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">Written before the run</text><line x1="266" y1="430" x2="286" y2="430" stroke="#1A2332" stroke-width="1.7" marker-end="url(#a)"/><rect x="294" y="56" width="730" height="788" rx="8" fill="#F7F9FC" stroke="#D5DEE8" stroke-width="1.5"/><path d="M570 68 L580 72 V79 C580 84 575 88 570 90 C565 88 560 84 560 79 V72 Z" fill="#2B6CB0"/><path d="M570 74 L574 76 V80 C574 82.5 572 84 570 85 C568 84 566 82.5 566 80 V76 Z" fill="#fff"/><text x="590" y="88" font-size="18" font-weight="700" fill="#1A2332" text-anchor="start">AgentShield-LCE</text><text x="460" y="112" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="middle">An evaluation lifecycle. Not a new defense algorithm.</text><rect x="310" y="128" width="698" height="200" rx="8" fill="#E7F1FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="326" y="154" font-size="15" font-weight="700" fill="#1A365D" text-anchor="start">Runtime  ·  the system under test</text><rect x="326" y="172" width="152" height="44" rx="8" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5"/><text x="402" y="200" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">Instruction</text><line x1="478" y1="194" x2="490" y2="194" stroke="#2B6CB0" stroke-width="1.7" marker-end="url(#bl)"/><rect x="494" y="172" width="152" height="44" rx="8" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5"/><text x="570" y="200" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">Planner</text><line x1="646" y1="194" x2="658" y2="194" stroke="#2B6CB0" stroke-width="1.7" marker-end="url(#bl)"/><rect x="662" y="172" width="152" height="44" rx="8" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5"/><text x="738" y="200" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">Tools</text><line x1="814" y1="194" x2="826" y2="194" stroke="#2B6CB0" stroke-width="1.7" marker-end="url(#bl)"/><rect x="830" y="172" width="152" height="44" rx="8" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5" stroke-dasharray="5 3.5"/><text x="906" y="200" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">Memory</text><text x="326" y="244" font-size="13" font-weight="400" fill="#2A4365" text-anchor="start">Memory is optional. Stage 1 registers it, or waives it. A waiver is not a pass.</text><text x="326" y="266" font-size="13" font-weight="400" fill="#2A4365" text-anchor="start">Peers only if registered. Task end leaves. A control needs a new run.</text><text x="326" y="308" font-size="12.5" font-weight="700" fill="#2A4365" text-anchor="start">G1–G4 are evaluation gates, not runtime steps. They assess the record produced at each stage.</text><rect x="310" y="340" width="698" height="36" rx="6" fill="#F4F5F7" stroke="#718096" stroke-width="1.5"/><text x="326" y="363" font-size="12.5" font-weight="600" fill="#1A2332" text-anchor="start">Trace: the evidence bridge from runtime to evaluation. Gates do not steer the runtime loop.</text><rect x="310" y="388" width="698" height="150" rx="8" fill="#F4E9FB" stroke="#6B46C1" stroke-width="1.5"/><text x="326" y="414" font-size="15" font-weight="700" fill="#553C9A" text-anchor="start">Evaluation  ·  checkpoints on the record, not serving steps</text><rect x="330" y="432" width="150" height="40" rx="8" fill="#ffffff" stroke="#6B46C1" stroke-width="1.5"/><text x="405" y="458" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">G1 Prepare</text><line x1="480" y1="452" x2="492" y2="452" stroke="#6B46C1" stroke-width="1.7" marker-end="url(#pu)"/><rect x="496" y="432" width="150" height="40" rx="8" fill="#ffffff" stroke="#6B46C1" stroke-width="1.5"/><text x="571" y="458" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">G2 Trace</text><line x1="646" y1="452" x2="658" y2="452" stroke="#6B46C1" stroke-width="1.7" marker-end="url(#pu)"/><rect x="662" y="432" width="150" height="40" rx="8" fill="#ffffff" stroke="#6B46C1" stroke-width="1.5"/><text x="737" y="458" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">G3 Score</text><line x1="812" y1="452" x2="824" y2="452" stroke="#6B46C1" stroke-width="1.7" marker-end="url(#pu)"/><rect x="828" y="432" width="150" height="40" rx="8" fill="#ffffff" stroke="#6B46C1" stroke-width="1.5"/><text x="903" y="458" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">G4 Rerun</text><text x="326" y="508" font-size="13" font-weight="400" fill="#553C9A" text-anchor="start">A pass is complete evidence. It is not a finding that the agent is secure.</text><rect x="310" y="554" width="164" height="78" rx="8" fill="#ffffff" stroke="#8AA0B8" stroke-width="1.5"/><text x="322" y="584" font-size="13.5" font-weight="700" fill="#1A2332" text-anchor="start">Threat model</text><text x="322" y="608" font-size="12" font-weight="400" fill="#3D4A5C" text-anchor="start">Actors and TB1–TB5</text><rect x="482" y="554" width="164" height="78" rx="8" fill="#ffffff" stroke="#8AA0B8" stroke-width="1.5"/><text x="494" y="584" font-size="13.5" font-weight="700" fill="#1A2332" text-anchor="start">Controls C1–C10</text><text x="494" y="608" font-size="12" font-weight="400" fill="#3D4A5C" text-anchor="start">Four control classes</text><rect x="654" y="554" width="164" height="78" rx="8" fill="#ffffff" stroke="#8AA0B8" stroke-width="1.5"/><text x="666" y="584" font-size="13.5" font-weight="700" fill="#1A2332" text-anchor="start">Trace fields</text><text x="666" y="608" font-size="12" font-weight="400" fill="#3D4A5C" text-anchor="start">Plan is not an oracle</text><rect x="826" y="554" width="164" height="78" rx="8" fill="#ffffff" stroke="#8AA0B8" stroke-width="1.5"/><text x="838" y="584" font-size="13.5" font-weight="700" fill="#1A2332" text-anchor="start">Nine metrics</text><text x="838" y="608" font-size="12" font-weight="400" fill="#3D4A5C" text-anchor="start">No composite score</text><text x="310" y="668" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">These four cards are not extra stages.</text><text x="310" y="692" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">Stages, fail returns, and the report are Figures 4 and 6.</text><text x="310" y="760" font-size="13" font-weight="700" fill="#3D4A5C" text-anchor="start">No number on this figure has been measured.</text><rect x="1040" y="56" width="264" height="788" rx="8" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="1056" y="84" font-size="16" font-weight="700" fill="#1A2332" text-anchor="start">Outputs</text><rect x="1056" y="108" width="232" height="80" rx="8" fill="#ffffff" stroke="#2F8F4E" stroke-width="1.5"/><text x="1072" y="142" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Findings</text><text x="1072" y="164" font-size="13" font-weight="400" fill="#276749" text-anchor="start">Each one tied to a trace</text><rect x="1056" y="204" width="232" height="80" rx="8" fill="#ffffff" stroke="#2F8F4E" stroke-width="1.5"/><text x="1072" y="238" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Attack success</text><text x="1072" y="260" font-size="13" font-weight="400" fill="#276749" text-anchor="start">Per check, not alone</text><rect x="1056" y="300" width="232" height="80" rx="8" fill="#ffffff" stroke="#2F8F4E" stroke-width="1.5"/><text x="1072" y="334" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Task success</text><text x="1072" y="356" font-size="13" font-weight="400" fill="#276749" text-anchor="start">Same pairs, both runs</text><rect x="1056" y="396" width="232" height="80" rx="8" fill="#ffffff" stroke="#2F8F4E" stroke-width="1.5"/><text x="1072" y="430" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Detection</text><text x="1072" y="452" font-size="13" font-weight="400" fill="#276749" text-anchor="start">Or “not monitored”</text><rect x="1056" y="492" width="232" height="80" rx="8" fill="#ffffff" stroke="#2F8F4E" stroke-width="1.5"/><text x="1072" y="526" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Leftovers</text><text x="1072" y="548" font-size="13" font-weight="400" fill="#276749" text-anchor="start">Identifiers still failing</text><rect x="1056" y="588" width="232" height="80" rx="8" fill="#ffffff" stroke="#2F8F4E" stroke-width="1.5"/><text x="1072" y="622" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Recovery</text><text x="1072" y="644" font-size="13" font-weight="400" fill="#276749" text-anchor="start">Or a listed residual</text><rect x="1056" y="684" width="232" height="80" rx="8" fill="#ffffff" stroke="#2F8F4E" stroke-width="1.5"/><text x="1072" y="718" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Release record</text><text x="1072" y="740" font-size="13" font-weight="400" fill="#276749" text-anchor="start">Versions, waivers, script</text><line x1="1024" y1="430" x2="1036" y2="430" stroke="#276749" stroke-width="1.7" marker-end="url(#gn)"/>
</svg>
