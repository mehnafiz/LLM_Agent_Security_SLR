<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860">
<rect width="1320" height="860" fill="#ffffff"/>
<style>text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#1A2332"/></marker><marker id="bl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#2B6CB0"/></marker><marker id="pu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#6B46C1"/></marker><marker id="rd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#C53030"/></marker><marker id="gn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#276749"/></marker></defs>
<rect x="0" y="0" width="1320" height="40" rx="0" fill="#1B365D" stroke="#1B365D" stroke-width="1.5"/><text x="16" y="26" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Fig. 6.   Evaluation and validation workflow</text><rect x="16" y="56" width="204" height="168" rx="8" fill="#E7F1FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="28" y="84" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">1–2  Scope</text><text x="28" y="112" font-size="13" font-weight="500" fill="#1A2332" text-anchor="start">Identify the system</text><text x="28" y="134" font-size="13" font-weight="500" fill="#1A2332" text-anchor="start">Threat model</text><text x="28" y="164" font-size="12.5" font-weight="400" fill="#3D4A5C" text-anchor="start">G1: name or waive</text><line x1="220" y1="140" x2="230" y2="140" stroke="#1A2332" stroke-width="1.7" marker-end="url(#a)"/><rect x="233" y="56" width="204" height="168" rx="8" fill="#F4E9FB" stroke="#6B46C1" stroke-width="1.5"/><text x="245" y="84" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">3–4  Tests</text><text x="245" y="112" font-size="13" font-weight="500" fill="#1A2332" text-anchor="start">Requirements</text><text x="245" y="134" font-size="13" font-weight="500" fill="#1A2332" text-anchor="start">Paired cases</text><text x="245" y="164" font-size="12.5" font-weight="400" fill="#3D4A5C" text-anchor="start">Checks declared first</text><line x1="437" y1="140" x2="447" y2="140" stroke="#1A2332" stroke-width="1.7" marker-end="url(#a)"/><rect x="450" y="56" width="204" height="168" rx="8" fill="#E7F1FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="460" y="80" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">5  Run</text><text x="460" y="104" font-size="12.5" font-weight="500" fill="#1A2332" text-anchor="start">Sandbox the tools</text><text x="460" y="124" font-size="12" font-weight="500" fill="#1A2332" text-anchor="start">A scored case needs a trace</text><text x="460" y="144" font-size="11.5" font-weight="500" fill="#1A2332" text-anchor="start">A runner failure is not a trace</text><text x="460" y="166" font-size="11" font-weight="700" fill="#1A365D" text-anchor="start">Excluded from metric denominators</text><line x1="654" y1="140" x2="664" y2="140" stroke="#1A2332" stroke-width="1.7" marker-end="url(#a)"/><rect x="667" y="56" width="204" height="168" rx="8" fill="#FFF6EA" stroke="#C05621" stroke-width="1.5"/><text x="679" y="84" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">6–7  Score</text><text x="679" y="112" font-size="13" font-weight="500" fill="#1A2332" text-anchor="start">Apply the checks</text><text x="679" y="134" font-size="13" font-weight="500" fill="#1A2332" text-anchor="start">Mark detection</text><text x="679" y="164" font-size="12.5" font-weight="400" fill="#3D4A5C" text-anchor="start">G3: cite the field</text><line x1="871" y1="140" x2="881" y2="140" stroke="#1A2332" stroke-width="1.7" marker-end="url(#a)"/><rect x="884" y="56" width="204" height="168" rx="8" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="896" y="84" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">8  Mitigate</text><text x="896" y="112" font-size="13" font-weight="500" fill="#1A2332" text-anchor="start">Named controls</text><text x="896" y="134" font-size="13" font-weight="500" fill="#1A2332" text-anchor="start">Same pairs, new traces</text><text x="896" y="164" font-size="12.5" font-weight="400" fill="#3D4A5C" text-anchor="start">G4: rerun, or a waiver</text><line x1="1088" y1="140" x2="1098" y2="140" stroke="#1A2332" stroke-width="1.7" marker-end="url(#a)"/><rect x="1101" y="56" width="204" height="80" rx="8" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="1113" y="78" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">9  Recover</text><text x="1113" y="98" font-size="12.5" font-weight="500" fill="#1A2332" text-anchor="start">Restore, then rerun</text><text x="1113" y="118" font-size="12" font-weight="400" fill="#276749" text-anchor="start">Not a gate</text><rect x="1101" y="144" width="204" height="80" rx="8" fill="#F4F5F7" stroke="#5C6B7A" stroke-width="1.5"/><text x="1113" y="166" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">10  Report</text><text x="1113" y="186" font-size="12.5" font-weight="500" fill="#1A2332" text-anchor="start">Release record</text><text x="1113" y="206" font-size="12" font-weight="400" fill="#3D4A5C" text-anchor="start">Not a gate</text><rect x="16" y="244" width="820" height="250" rx="8" fill="#F7F9FC" stroke="#8AA0B8" stroke-width="1.5" stroke-dasharray="5 3.5"/><text x="32" y="272" font-size="15" font-weight="700" fill="#1A2332" text-anchor="start">Same pairs, two roles</text><rect x="32" y="290" width="370" height="150" rx="8" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="48" y="322" font-size="15" font-weight="700" fill="#1A2332" text-anchor="start">Benign case</text><text x="48" y="350" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">The user task. No attack carrier.</text><text x="48" y="376" font-size="13" font-weight="400" fill="#276749" text-anchor="start">TS is the share whose check holds.</text><rect x="420" y="290" width="390" height="150" rx="8" fill="#FDECEC" stroke="#D64545" stroke-width="1.5"/><text x="436" y="322" font-size="15" font-weight="700" fill="#1A2332" text-anchor="start">Attack case</text><text x="436" y="350" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Same task. A carrier the system reads.</text><text x="436" y="376" font-size="13" font-weight="400" fill="#9B2C2C" text-anchor="start">AS is the forbidden effect, not a self-report.</text><text x="32" y="468" font-size="13.5" font-weight="400" fill="#3D4A5C" text-anchor="start">UA is the benign check on the attack cases. Both can hold.</text><rect x="852" y="244" width="452" height="250" rx="8" fill="#E7F1FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="868" y="272" font-size="15" font-weight="700" fill="#1A2332" text-anchor="start">Kept separate. No composite.</text><text x="868" y="304" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">TS  task success, higher</text><text x="868" y="326" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">AS  attack success, lower</text><text x="868" y="348" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">UA  utility under attack, higher</text><text x="868" y="370" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">CS  covert success, lower</text><text x="868" y="392" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">DC  coverage and FN, before commit</text><text x="868" y="414" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">FP  among benign, if a detector ran</text><text x="868" y="436" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">LR  leftover identifiers, a set</text><text x="868" y="458" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">CAC  second manifest, or a waiver</text><rect x="16" y="512" width="1288" height="332" rx="8" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="32" y="544" font-size="16" font-weight="700" fill="#1A2332" text-anchor="start">Baseline, protected run, and recovery</text><text x="32" y="584" font-size="14.5" font-weight="400" fill="#1A2332" text-anchor="start">Baseline: the same manifest, no control under test.</text><text x="32" y="614" font-size="14.5" font-weight="400" fill="#1A2332" text-anchor="start">Protected: named controls only. Same pairs, new traces. Task success on both runs. Leftovers named.</text><text x="32" y="644" font-size="14.5" font-weight="400" fill="#1A2332" text-anchor="start">Changed attacks: a second manifest declared beforehand, or a waiver. Do not copy the first coverage.</text><text x="32" y="674" font-size="14.5" font-weight="400" fill="#1A2332" text-anchor="start">Stage 9: restore reversible state. Rerun failed identifiers and a sample of earlier passes.</text><text x="32" y="704" font-size="14.5" font-weight="400" fill="#1A2332" text-anchor="start">Stage 10: freeze the release record. It is not a gate. A changed agent returns to Stage 2.</text><text x="32" y="734" font-size="14.5" font-weight="400" fill="#1A2332" text-anchor="start">An irreversible effect stays a listed residual. A restore that is not rerun is not recovery.</text><text x="32" y="764" font-size="14.5" font-weight="400" fill="#1A2332" text-anchor="start">A lower attack success alone does not finish mitigation. A runner failure is not a defense success.</text><text x="32" y="794" font-size="14.5" font-weight="700" fill="#276749" text-anchor="start">This sheet is the procedure. It is not a measured result.</text>
</svg>
