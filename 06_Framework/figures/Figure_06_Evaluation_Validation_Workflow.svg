<text x="36.0" y="34.0" font-size="20" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="36.0" dy="0">Figure 6. Evaluation evidence path</tspan></text>
<text x="36.0" y="58.0" font-size="13" fill="#5D6D7E" text-anchor="start"><tspan x="36.0" dy="0">Protocol for a future run. This project has not executed it. No threshold and no composite score are defined.</tspan></text>
<rect x="530.0" y="88.0" width="500.0" height="68.0" rx="8" fill="#F4F6F7" stroke="#5D6D7E" stroke-width="1.6"/>
<text x="780.0" y="117.0" font-size="14" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="780.0" dy="0">Frozen test manifest</tspan><tspan x="780.0" dy="18">Pairs, carriers, and checks declared before the run</tspan></text>
<line x1="680.0" y1="156.0" x2="360.0" y2="210.0" stroke="#1C2833" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<line x1="880.0" y1="156.0" x2="1200.0" y2="210.0" stroke="#1C2833" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<rect x="110.0" y="210.0" width="500.0" height="78.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="360.0" y="243.0" font-size="15" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="360.0" dy="0">Baseline configuration</tspan><tspan x="360.0" dy="20">No control under test</tspan></text>
<rect x="950.0" y="210.0" width="500.0" height="78.0" rx="8" fill="#E8F8F5" stroke="#196F3D" stroke-width="1.6"/>
<text x="1200.0" y="243.0" font-size="15" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="1200.0" dy="0">Protected configuration</tspan><tspan x="1200.0" dy="20">Named controls, with class and point</tspan></text>
<line x1="360.0" y1="288.0" x2="360.0" y2="330.0" stroke="#1A5276" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)"/>
<line x1="1200.0" y1="288.0" x2="1200.0" y2="330.0" stroke="#196F3D" stroke-width="1.6" fill="none" marker-end="url(#arrGreen)"/>
<rect x="160.0" y="330.0" width="400.0" height="64.0" rx="8" fill="#F4F6F7" stroke="#5D6D7E" stroke-width="1.6"/>
<text x="360.0" y="367.0" font-size="15" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="360.0" dy="0">Sandbox run and trace</tspan></text>
<rect x="1000.0" y="330.0" width="400.0" height="64.0" rx="8" fill="#F4F6F7" stroke="#5D6D7E" stroke-width="1.6"/>
<text x="1200.0" y="367.0" font-size="15" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="1200.0" dy="0">Same manifest, new trace</tspan></text>
<line x1="360.0" y1="394.0" x2="640.0" y2="470.0" stroke="#1C2833" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<line x1="1200.0" y1="394.0" x2="920.0" y2="470.0" stroke="#1C2833" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<rect x="560.0" y="470.0" width="440.0" height="86.0" rx="8" fill="#FEF5E7" stroke="#B9770E" stroke-width="1.6"/>
<text x="780.0" y="499.0" font-size="14" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="780.0" dy="0">Decision G2</tspan><tspan x="780.0" dy="18">A tool trace exists for every case,</tspan><tspan x="780.0" dy="18">or the runner failure is recorded</tspan></text>
<rect x="40.0" y="470.0" width="470.0" height="86.0" rx="8" fill="#FDEDEC" stroke="#922B21" stroke-width="1.6"/>
<text x="275.0" y="499.0" font-size="14" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="275.0" dy="0">G2 fail</tspan><tspan x="275.0" dy="18">Return to the run.</tspan><tspan x="275.0" dy="18">Do not score a missing log.</tspan></text>
<line x1="560.0" y1="513.0" x2="518.0" y2="513.0" stroke="#922B21" stroke-width="1.6" fill="none" marker-end="url(#arrRed)"/>
<line x1="780.0" y1="556.0" x2="780.0" y2="600.0" stroke="#1C2833" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<rect x="280.0" y="600.0" width="1000.0" height="110.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="300.0" y="628.0" font-size="15" fill="#1A5276" text-anchor="start" font-weight="600"><tspan x="300.0" dy="0">Proposed metrics, computed only from the trace</tspan></text>
<text x="300.0" y="656.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="300.0" dy="0">Task success, attack success, utility under attack, covert success,</tspan></text>
<text x="300.0" y="678.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="300.0" dy="0">detection coverage, false negatives, false positives, leftover identifiers.</tspan></text>
<text x="300.0" y="700.0" font-size="13" fill="#5D6D7E" text-anchor="start"><tspan x="300.0" dy="0">Runner failures stay outside every denominator. If no attack succeeds, coverage is undefined.</tspan></text>
<line x1="780.0" y1="710.0" x2="780.0" y2="748.0" stroke="#1C2833" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<rect x="480.0" y="748.0" width="600.0" height="78.0" rx="8" fill="#FEF5E7" stroke="#B9770E" stroke-width="1.6"/>
<text x="780.0" y="782.0" font-size="14" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="780.0" dy="0">Decision G3</tspan><tspan x="780.0" dy="18">Each number cites a trace field. Task success uses the same pairs.</tspan></text>
<rect x="40.0" y="748.0" width="400.0" height="78.0" rx="8" fill="#FDEDEC" stroke="#922B21" stroke-width="1.6"/>
<text x="240.0" y="772.0" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="240.0" dy="0">G3 fail</tspan><tspan x="240.0" dy="18">Wrong check or carrier: Stage 4.</tspan><tspan x="240.0" dy="18">Arithmetic only: Stage 6.</tspan></text>
<line x1="480.0" y1="787.0" x2="440.0" y2="787.0" stroke="#922B21" stroke-width="1.6" fill="none" marker-end="url(#arrRed)"/>
<line x1="780.0" y1="826.0" x2="780.0" y2="864.0" stroke="#1C2833" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<rect x="280.0" y="864.0" width="1000.0" height="100.0" rx="8" fill="#E8F8F5" stroke="#196F3D" stroke-width="1.6"/>
<text x="300.0" y="892.0" font-size="15" fill="#196F3D" text-anchor="start" font-weight="600"><tspan x="300.0" dy="0">Only when a control is under test</tspan></text>
<text x="300.0" y="918.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="300.0" dy="0">G4 requires the class, the observation point, both task-success values, the leftover identifiers,</tspan></text>
<text x="300.0" y="940.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="300.0" dy="0">and a changed-attack rerun or a waiver. Stage 9 then restores state or lists the residual.</tspan></text>
<line x1="780.0" y1="964.0" x2="780.0" y2="1004.0" stroke="#1C2833" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<rect x="430.0" y="1004.0" width="700.0" height="72.0" rx="8" fill="#F4F6F7" stroke="#5D6D7E" stroke-width="1.6"/>
<text x="780.0" y="1035.0" font-size="14" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="780.0" dy="0">Stage 10 release record</tspan><tspan x="780.0" dy="18">Versions, checks, traces, waivers, and the scoring script</tspan></text>
<rect x="40.0" y="1100.0" width="1480.0" height="100.0" rx="8" fill="#F4F6F7" stroke="#5D6D7E" stroke-width="1.6"/>
<text x="56.0" y="1130.0" font-size="14" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="56.0" dy="0">Not defined, and not implied: a pass threshold, a composite score, a significance test, or an overhead limit.</tspan></text>
<text x="56.0" y="1156.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="56.0" dy="0">Optional tool-call counts and wall-clock times may be stored. Wall-clock time is machine-dependent and is not a cross-paper result.</tspan></text>
<text x="56.0" y="1180.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="56.0" dy="0">The next change of the agent returns the record to Stage 2. This diagram does not report an experiment.</tspan></text>
</svg>
