<text x="490.0" y="286.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="490.0" dy="0">Plan rewritten after</tspan><tspan x="490.0" dy="18">untrusted content</tspan></text>
<rect x="478.0" y="382.0" width="180.0" height="130.0" rx="8" fill="#E8F8F5" stroke="#196F3D" stroke-width="1.6"/>
