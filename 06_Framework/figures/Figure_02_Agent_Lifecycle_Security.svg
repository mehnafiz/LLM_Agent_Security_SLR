<text x="1216.0" y="180.0" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="1216.0" dy="0">6  Tool execution</tspan><tspan x="1216.0" dy="18">TB1, TB2</tspan></text>
<rect x="1126.0" y="236.0" width="180.0" height="130.0" rx="8" fill="#FDEDEC" stroke="#922B21" stroke-width="1.6"/>
<text x="1138.0" y="260.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="1138.0" dy="0">Exposure</tspan></text>
<text x="1138.0" y="286.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="1138.0" dy="0">Injected result;</tspan><tspan x="1138.0" dy="18">bad arguments</tspan></text>
<rect x="1126.0" y="382.0" width="180.0" height="130.0" rx="8" fill="#E8F8F5" stroke="#196F3D" stroke-width="1.6"/>
<text x="1138.0" y="406.0" font-size="12" fill="#196F3D" text-anchor="start" font-weight="600"><tspan x="1138.0" dy="0">Control</tspan></text>
<text x="1138.0" y="432.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="1138.0" dy="0">Data channel; argument</tspan><tspan x="1138.0" dy="18">and destination limits</tspan></text>
<line x1="1316.0" y1="186.0" x2="1332.0" y2="186.0" stroke="#1A5276" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)"/>
<rect x="1332.0" y="140.0" width="200.0" height="430.0" rx="10" fill="#FFFFFF" stroke="#D5D8DC" stroke-width="1.2"/>
<rect x="1342.0" y="154.0" width="180.0" height="64.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="1432.0" y="180.0" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="1432.0" dy="0">7  Peer exchange</tspan><tspan x="1432.0" dy="18">TB4</tspan></text>
<rect x="1342.0" y="236.0" width="180.0" height="130.0" rx="8" fill="#FDEDEC" stroke="#922B21" stroke-width="1.6"/>
<text x="1354.0" y="260.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="1354.0" dy="0">Exposure</tspan></text>
<text x="1354.0" y="286.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="1354.0" dy="0">Message causes a</tspan><tspan x="1354.0" dy="18">tool call</tspan></text>
<rect x="1342.0" y="382.0" width="180.0" height="130.0" rx="8" fill="#E8F8F5" stroke="#196F3D" stroke-width="1.6"/>
<text x="1354.0" y="406.0" font-size="12" fill="#196F3D" text-anchor="start" font-weight="600"><tspan x="1354.0" dy="0">Control</tspan></text>
<text x="1354.0" y="432.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="1354.0" dy="0">Peer allow-list;</tspan><tspan x="1354.0" dy="18">else drop the message</tspan></text>
<line x1="1532.0" y1="186.0" x2="1548.0" y2="186.0" stroke="#1A5276" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)"/>
<rect x="1548.0" y="140.0" width="200.0" height="430.0" rx="10" fill="#FFFFFF" stroke="#D5D8DC" stroke-width="1.2"/>
<rect x="1558.0" y="154.0" width="180.0" height="64.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="1648.0" y="180.0" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="1648.0" dy="0">8  Commit / recover</tspan><tspan x="1648.0" dy="18">—</tspan></text>
<rect x="1558.0" y="236.0" width="180.0" height="130.0" rx="8" fill="#FDEDEC" stroke="#922B21" stroke-width="1.6"/>
<text x="1570.0" y="260.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="1570.0" dy="0">Exposure</tspan></text>
<text x="1570.0" y="286.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="1570.0" dy="0">Effect survives</tspan><tspan x="1570.0" dy="18">the session</tspan></text>
<rect x="1558.0" y="382.0" width="180.0" height="130.0" rx="8" fill="#E8F8F5" stroke="#196F3D" stroke-width="1.6"/>
<text x="1570.0" y="406.0" font-size="12" fill="#196F3D" text-anchor="start" font-weight="600"><tspan x="1570.0" dy="0">Control</tspan></text>
<text x="1570.0" y="432.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="1570.0" dy="0">Block commit; roll back</tspan><tspan x="1570.0" dy="18">or list irreversible</tspan></text>
<text x="36.0" y="600.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="36.0" dy="0">The arrows are the usual pass. Memory may be read again after a tool result. A missing peer, memory, or permission split is waived at G1.</tspan></text>
<rect x="36.0" y="640.0" width="1688.0" height="150.0" rx="10" fill="#FDEDEC" stroke="#922B21" stroke-width="1.6"/>
<text x="52.0" y="670.0" font-size="15" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="52.0" dy="0">Attack carriers entering the path</tspan></text>
<text x="52.0" y="700.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="52.0" dy="0">Untrusted content (page, email, retrieval, tool result) enters at memory and at tool execution. It is not an eighth observation point.</tspan></text>
<text x="52.0" y="726.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="52.0" dy="0">A poisoned tool description enters at configuration and is observed at tool selection. Tool code is observed at execution.</tspan></text>
<text x="52.0" y="752.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="52.0" dy="0">A peer message enters at peer exchange. A malicious instruction enters at instruction intake and is judged by the later tool check.</tspan></text>
<rect x="36.0" y="810.0" width="1688.0" height="180.0" rx="10" fill="#F4F6F7" stroke="#5D6D7E" stroke-width="1.6"/>
<text x="52.0" y="842.0" font-size="15" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="52.0" dy="0">What Stage 5 records at these points</tspan></text>
<text x="52.0" y="872.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="52.0" dy="0">Registry version and pin; instruction identifier; plan text marked non-oracle; memory operation, entry identifier, and provenance;</tspan></text>
<text x="52.0" y="896.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="52.0" dy="0">tool name, arguments, result, committed flag, and order; peer destination and the receiver’s subsequent tool call; restore log.</tspan></text>
<text x="52.0" y="928.0" font-size="14" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="52.0" dy="0">TB5. The score is computed from those fields. The model’s statement that it refused or complied is not a field.</tspan></text>
<text x="52.0" y="958.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="52.0" dy="0">Chat-only jailbreak, with no tool, memory, or peer effect, has no check on this path and is out of scope.</tspan></text>
</svg>
