<rect x="694.0" y="236.0" width="180.0" height="130.0" rx="8" fill="#FDEDEC" stroke="#922B21" stroke-width="1.6"/>
<text x="706.0" y="260.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="706.0" dy="0">Exposure</tspan></text>
<text x="706.0" y="286.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="706.0" dy="0">Poisoned entry;</tspan><tspan x="706.0" dy="18">later disclosure</tspan></text>
<rect x="694.0" y="382.0" width="180.0" height="130.0" rx="8" fill="#E8F8F5" stroke="#196F3D" stroke-width="1.6"/>
<text x="706.0" y="406.0" font-size="12" fill="#196F3D" text-anchor="start" font-weight="600"><tspan x="706.0" dy="0">Control</tspan></text>
<text x="706.0" y="432.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="706.0" dy="0">Write policy;</tspan><tspan x="706.0" dy="18">provenance on read</tspan></text>
