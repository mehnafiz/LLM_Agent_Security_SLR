<rect x="910.0" y="236.0" width="180.0" height="130.0" rx="8" fill="#FDEDEC" stroke="#922B21" stroke-width="1.6"/>
<text x="922.0" y="260.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="922.0" dy="0">Exposure</tspan></text>
<text x="922.0" y="286.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="922.0" dy="0">Wrong tool chosen</tspan><tspan x="922.0" dy="18">from the manual</tspan></text>
<rect x="910.0" y="382.0" width="180.0" height="130.0" rx="8" fill="#E8F8F5" stroke="#196F3D" stroke-width="1.6"/>
<text x="922.0" y="406.0" font-size="12" fill="#196F3D" text-anchor="start" font-weight="600"><tspan x="922.0" dy="0">Control</tspan></text>
<text x="922.0" y="432.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="922.0" dy="0">Deny names outside</tspan><tspan x="922.0" dy="18">the task allow-list</tspan></text>
<line x1="1100.0" y1="186.0" x2="1116.0" y2="186.0" stroke="#1A5276" stroke-width="1.6" fill="none" marker-end="url(#arrBlue)"/>
