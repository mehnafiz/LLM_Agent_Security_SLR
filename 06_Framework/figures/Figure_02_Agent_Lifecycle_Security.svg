<text x="36.0" y="36.0" font-size="20" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="36.0" dy="0">Figure 2. Security along the agent path</tspan></text>
<text x="36.0" y="60.0" font-size="13" fill="#5D6D7E" text-anchor="start"><tspan x="36.0" dy="0">Observation points of the system under test. This is not the evaluation-stage sequence. Gates are in Figure 4.</tspan></text>
