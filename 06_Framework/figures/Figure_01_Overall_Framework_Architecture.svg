<text x="1074.0" y="1077.0" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="1074.0" dy="0">Recover</tspan></text>
<text x="900.0" y="1116.0" font-size="12" fill="#1C2833" text-anchor="middle"><tspan x="900.0" dy="0">A gate checks the record. It is not on the serving path.</tspan></text>
<text x="900.0" y="1138.0" font-size="12" fill="#1C2833" text-anchor="middle"><tspan x="900.0" dy="0">TB5: the score uses the trace, not the model’s sentence.</tspan></text>
<text x="48.0" y="1708.0" font-size="13" fill="#5D6D7E" text-anchor="start"><tspan x="48.0" dy="0">A fail named on a gate steps back inside the ring. It does not start a new lifecycle. Figures 2–6 give the path, the threat map, the gate evidence, the controls, and the metrics.</tspan></text>
