<text x="718.0" y="97.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="718.0" dy="0">External or record</tspan></text>
<circle cx="900" cy="980" r="560" fill="none" stroke="#D4E6F1" stroke-width="14"/>
<circle cx="900" cy="980" r="268" fill="#F8FBFD" stroke="#1A5276" stroke-width="1.6"/>
