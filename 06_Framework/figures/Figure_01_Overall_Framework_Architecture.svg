<text x="200.0" y="97.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="200.0" dy="0">Threat or attack carrier</tspan></text>
<rect x="420.0" y="84.0" width="16.0" height="16.0" rx="3" fill="#FEF5E7" stroke="#B9770E" stroke-width="1.4"/>
<text x="442.0" y="97.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="442.0" dy="0">Evaluation gate</tspan></text>
