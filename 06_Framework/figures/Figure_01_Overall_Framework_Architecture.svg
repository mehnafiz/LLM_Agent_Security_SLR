<text x="48.0" y="38.0" font-size="22" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="48.0" dy="0">Figure 1. AgentShield-LCE, the closed evaluation cycle</tspan></text>
<text x="48.0" y="64.0" font-size="14" fill="#5D6D7E" text-anchor="start"><tspan x="48.0" dy="0">Clockwise on the ring is a pass. Stage 10 returns to Stage 2. Stage 1 enters once and is not repeated.</tspan></text>
<rect x="48.0" y="84.0" width="16.0" height="16.0" rx="3" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.4"/>
