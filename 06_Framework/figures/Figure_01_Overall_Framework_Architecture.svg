<text x="900.0" y="406.5" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="900.0" dy="0">S2</tspan><tspan x="900.0" dy="17">Catalog surfaces</tspan><tspan x="900.0" dy="17">or waive them</tspan></text>
<rect x="1108.8" y="471.9" width="188.0" height="74.0" rx="8" fill="#FEF5E7" stroke="#B9770E" stroke-width="1.6"/>
<text x="1202.8" y="495.4" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="1202.8" dy="0">G1</tspan><tspan x="1202.8" dy="17">Fail returns to S2</tspan><tspan x="1202.8" dy="17">Do not write tests</tspan></text>
<rect x="1315.4" y="710.4" width="188.0" height="74.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="1409.4" y="733.9" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="1409.4" dy="0">S3–S4</tspan><tspan x="1409.4" dy="17">Pair the task and</tspan><tspan x="1409.4" dy="17">declare the checks</tspan></text>
<rect x="1360.3" y="1022.7" width="188.0" height="74.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="1454.3" y="1046.2" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="1454.3" dy="0">S5</tspan><tspan x="1454.3" dy="17">Sandbox run.</tspan><tspan x="1454.3" dy="17">Keep the tool trace</tspan></text>
<rect x="1229.2" y="1309.7" width="188.0" height="74.0" rx="8" fill="#FEF5E7" stroke="#B9770E" stroke-width="1.6"/>
<text x="1323.2" y="1333.2" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="1323.2" dy="0">G2</tspan><tspan x="1323.2" dy="17">Fail returns to S5</tspan><tspan x="1323.2" dy="17">Do not score a gap</tspan></text>
<rect x="963.8" y="1480.3" width="188.0" height="74.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="1057.8" y="1503.8" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="1057.8" dy="0">S6</tspan><tspan x="1057.8" dy="17">Score only the</tspan><tspan x="1057.8" dy="17">declared trace check</tspan></text>
<rect x="648.2" y="1480.3" width="188.0" height="74.0" rx="8" fill="#FEF5E7" stroke="#B9770E" stroke-width="1.6"/>
<text x="742.2" y="1503.8" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="742.2" dy="0">G3</tspan><tspan x="742.2" dy="17">Wrong check → S4</tspan><tspan x="742.2" dy="17">Bad arithmetic → S6</tspan></text>
<rect x="382.8" y="1309.7" width="188.0" height="74.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="476.8" y="1333.2" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="476.8" dy="0">S7–S8</tspan><tspan x="476.8" dy="17">Coverage, then</tspan><tspan x="476.8" dy="17">controls and rerun</tspan></text>
<rect x="251.7" y="1022.7" width="188.0" height="74.0" rx="8" fill="#FEF5E7" stroke="#B9770E" stroke-width="1.6"/>
<text x="345.7" y="1046.2" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="345.7" dy="0">G4</tspan><tspan x="345.7" dy="17">Fail returns to S8</tspan><tspan x="345.7" dy="17">Rerun or waiver</tspan></text>
<rect x="296.6" y="710.4" width="188.0" height="74.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="390.6" y="733.9" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="390.6" dy="0">S9</tspan><tspan x="390.6" dy="17">Restore, or list</tspan><tspan x="390.6" dy="17">what cannot be undone</tspan></text>
<rect x="503.2" y="471.9" width="188.0" height="74.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="597.2" y="495.4" font-size="13" fill="#1C2833" text-anchor="middle" font-weight="600"><tspan x="597.2" dy="0">S10</tspan><tspan x="597.2" dy="17">Freeze the record.</tspan><tspan x="597.2" dy="17">Then return to S2</tspan></text>
