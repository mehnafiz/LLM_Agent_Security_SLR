<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1040" viewBox="0 0 1760 1040">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<style>text { font-family: Helvetica, Arial, sans-serif; }</style>

        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#1C2833"/>
          </marker>
          <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#922B21"/>
          </marker>
          <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#196F3D"/>
          </marker>
          <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#B9770E"/>
          </marker>
          <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#1A5276"/>
          </marker>
        </defs>
        
<text x="36.0" y="34.0" font-size="20" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="36.0" dy="0">Figure 5. Threat-to-control mapping</tspan></text>
<text x="36.0" y="58.0" font-size="13" fill="#5D6D7E" text-anchor="start"><tspan x="36.0" dy="0">Design controls. No cell is a measured reduction. Identifiers match Mitigation_Strategy.md.</tspan></text>
<rect x="28.0" y="84.0" width="1704.0" height="40.0" rx="6" fill="#F4F6F7" stroke="#5D6D7E" stroke-width="1.6"/>
<text x="36.0" y="110.0" font-size="13" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="36.0" dy="0">Attack</tspan></text>
<text x="246.0" y="110.0" font-size="13" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="246.0" dy="0">Observation point</tspan></text>
<text x="446.0" y="110.0" font-size="13" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="446.0" dy="0">Class</tspan></text>
<text x="596.0" y="110.0" font-size="13" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="596.0" dy="0">Mechanism</tspan></text>
<text x="1026.0" y="110.0" font-size="13" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="1026.0" dy="0">Property</tspan></text>
<text x="1206.0" y="110.0" font-size="13" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="1206.0" dy="0">What remains</tspan></text>
<rect x="28.0" y="136.0" width="1704.0" height="94.0" rx="4" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1"/>
<rect x="36.0" y="144.0" width="194.0" height="78.0" rx="4" fill="#FDEDEC" stroke="#922B21" stroke-width="1"/>
<text x="44.0" y="164.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="44.0" dy="0">Indirect prompt injection</tspan></text>
<text x="254.0" y="164.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="254.0" dy="0">Tool execution, before</tspan><tspan x="254.0" dy="15">the result is an</tspan><tspan x="254.0" dy="15">instruction</tspan></text>
<text x="454.0" y="164.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="454.0" dy="0">Prevent C1; detect</tspan><tspan x="454.0" dy="15">C5; respond C6</tspan></text>
<text x="604.0" y="164.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="604.0" dy="0">Keep untrusted text in a data channel. Flag a call the</tspan><tspan x="604.0" dy="15">prior plan did not contain. Stop the commit.</tspan></text>
<text x="1034.0" y="164.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1034.0" dy="0">Integrity</tspan></text>
<text x="1214.0" y="164.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1214.0" dy="0">Adaptive wording can pass a filter. A plan written after the poison</tspan><tspan x="1214.0" dy="15">can look consistent.</tspan></text>
<rect x="28.0" y="236.0" width="1704.0" height="94.0" rx="4" fill="#F8F9F9" stroke="#E5E8EB" stroke-width="1"/>
<rect x="36.0" y="244.0" width="194.0" height="78.0" rx="4" fill="#FDEDEC" stroke="#922B21" stroke-width="1"/>
<text x="44.0" y="264.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="44.0" dy="0">Unauthorized tool use and</tspan><tspan x="44.0" dy="15">exfiltration</tspan></text>
<text x="254.0" y="264.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="254.0" dy="0">Tool execution, before</tspan><tspan x="254.0" dy="15">commit</tspan></text>
<text x="454.0" y="264.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="454.0" dy="0">Prevent C2; respond</tspan><tspan x="454.0" dy="15">C6</tspan></text>
<text x="604.0" y="264.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="604.0" dy="0">Allow only declared tool names. Constrain arguments and</tspan><tspan x="604.0" dy="15">destinations to the Stage 4 predicate.</tspan></text>
<text x="1034.0" y="264.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1034.0" dy="0">Authorization;</tspan><tspan x="1034.0" dy="15">confidentiality</tspan></text>
<text x="1214.0" y="264.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1214.0" dy="0">A predicate that is too wide accepts the attacker’s argument. That</tspan><tspan x="1214.0" dy="15">error returns to Stage 4.</tspan></text>
<rect x="28.0" y="336.0" width="1704.0" height="94.0" rx="4" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1"/>
<rect x="36.0" y="344.0" width="194.0" height="78.0" rx="4" fill="#FDEDEC" stroke="#922B21" stroke-width="1"/>
<text x="44.0" y="364.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="44.0" dy="0">Tool-description poisoning</tspan></text>
<text x="254.0" y="364.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="254.0" dy="0">Configuration and tool</tspan><tspan x="254.0" dy="15">selection</tspan></text>
<text x="454.0" y="364.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="454.0" dy="0">Prevent C3</tspan></text>
<text x="604.0" y="364.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="604.0" dy="0">Call the tool only when the description hash matches the</tspan><tspan x="604.0" dy="15">register pin.</tspan></text>
<text x="1034.0" y="364.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1034.0" dy="0">Integrity of selection</tspan></text>
<text x="1214.0" y="364.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1214.0" dy="0">A pin freezes the manual that was trusted. It does not make a</tspan><tspan x="1214.0" dy="15">malicious manual benign.</tspan></text>
<rect x="28.0" y="436.0" width="1704.0" height="94.0" rx="4" fill="#F8F9F9" stroke="#E5E8EB" stroke-width="1"/>
<rect x="36.0" y="444.0" width="194.0" height="78.0" rx="4" fill="#FDEDEC" stroke="#922B21" stroke-width="1"/>
<text x="44.0" y="464.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="44.0" dy="0">Tool-code backdoor</tspan></text>
<text x="254.0" y="464.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="254.0" dy="0">Tool execution</tspan></text>
<text x="454.0" y="464.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="454.0" dy="0">Prevent C4; recover</tspan><tspan x="454.0" dy="15">C10</tspan></text>
<text x="604.0" y="464.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="604.0" dy="0">Require an implementation hash and a permission match.</tspan><tspan x="604.0" dy="15">Roll back if the tool can roll back.</tspan></text>
<text x="1034.0" y="464.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1034.0" dy="0">Authorization;</tspan><tspan x="1034.0" dy="15">integrity</tspan></text>
<text x="1214.0" y="464.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1214.0" dy="0">Waived when tool code is outside the register. Irreversible effects</tspan><tspan x="1214.0" dy="15">stay residual.</tspan></text>
<rect x="28.0" y="536.0" width="1704.0" height="94.0" rx="4" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1"/>
<rect x="36.0" y="544.0" width="194.0" height="78.0" rx="4" fill="#FDEDEC" stroke="#922B21" stroke-width="1"/>
<text x="44.0" y="564.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="44.0" dy="0">Memory poisoning</tspan></text>
<text x="254.0" y="564.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="254.0" dy="0">Memory write, then a</tspan><tspan x="254.0" dy="15">later read</tspan></text>
<text x="454.0" y="564.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="454.0" dy="0">Prevent and detect</tspan><tspan x="454.0" dy="15">C7; recover C10</tspan></text>
<text x="604.0" y="564.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="604.0" dy="0">Accept writes only from named carriers. Check provenance</tspan><tspan x="604.0" dy="15">on read. Delete and retest.</tspan></text>
<text x="1034.0" y="564.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1034.0" dy="0">Integrity of memory</tspan></text>
<text x="1214.0" y="564.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1214.0" dy="0">Provenance is origin, not a proof that the text is harmless.</tspan></text>
<rect x="28.0" y="636.0" width="1704.0" height="94.0" rx="4" fill="#F8F9F9" stroke="#E5E8EB" stroke-width="1"/>
<rect x="36.0" y="644.0" width="194.0" height="78.0" rx="4" fill="#FDEDEC" stroke="#922B21" stroke-width="1"/>
<text x="44.0" y="664.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="44.0" dy="0">Memory disclosure</tspan></text>
<text x="254.0" y="664.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="254.0" dy="0">Memory read, then an</tspan><tspan x="254.0" dy="15">outbound call</tspan></text>
<text x="454.0" y="664.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="454.0" dy="0">Prevent C8</tspan></text>
<text x="604.0" y="664.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="604.0" dy="0">Apply the same destination constraint to data that was</tspan><tspan x="604.0" dy="15">read from memory.</tspan></text>
<text x="1034.0" y="664.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1034.0" dy="0">Confidentiality</tspan></text>
<text x="1214.0" y="664.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1214.0" dy="0">A permitted destination that is broader than the task still leaks.</tspan></text>
<rect x="28.0" y="736.0" width="1704.0" height="94.0" rx="4" fill="#FFFFFF" stroke="#E5E8EB" stroke-width="1"/>
<rect x="36.0" y="744.0" width="194.0" height="78.0" rx="4" fill="#FDEDEC" stroke="#922B21" stroke-width="1"/>
<text x="44.0" y="764.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="44.0" dy="0">Peer-caused tool use</tspan></text>
<text x="254.0" y="764.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="254.0" dy="0">Peer exchange</tspan></text>
<text x="454.0" y="764.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="454.0" dy="0">Prevent, detect,</tspan><tspan x="454.0" dy="15">respond C9</tspan></text>
<text x="604.0" y="764.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="604.0" dy="0">A peer may cause only tools on the peer allow-list. Any</tspan><tspan x="604.0" dy="15">other request is dropped.</tspan></text>
<text x="1034.0" y="764.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1034.0" dy="0">Authorization</tspan></text>
<text x="1214.0" y="764.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1214.0" dy="0">Does not verify a protocol implementation. The score is not added to</tspan><tspan x="1214.0" dy="15">single-agent results.</tspan></text>
<rect x="28.0" y="836.0" width="1704.0" height="94.0" rx="4" fill="#F8F9F9" stroke="#E5E8EB" stroke-width="1"/>
<rect x="36.0" y="844.0" width="194.0" height="78.0" rx="4" fill="#FDEDEC" stroke="#922B21" stroke-width="1"/>
<text x="44.0" y="864.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="44.0" dy="0">Shifted attack pattern</tspan></text>
<text x="254.0" y="864.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="254.0" dy="0">Stage 8 rerun</tspan></text>
<text x="454.0" y="864.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="454.0" dy="0">Detect C6, plus the</tspan><tspan x="454.0" dy="15">rerun rule</tspan></text>
<text x="604.0" y="864.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="604.0" dy="0">Recompute coverage and false positives on a second</tspan><tspan x="604.0" dy="15">manifest declared before the rerun.</tspan></text>
<text x="1034.0" y="864.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1034.0" dy="0">Not a new property</tspan></text>
<text x="1214.0" y="864.0" font-size="12" fill="#1C2833" text-anchor="start"><tspan x="1214.0" dy="0">If the second manifest is waived, original-suite coverage is not</tspan><tspan x="1214.0" dy="15">reused.</tspan></text>
<text x="36.0" y="960.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="36.0" dy="0">Instruction-channel abuse uses C2. It is not a separate row: the check is still the unauthorized tool effect.</tspan></text>
<text x="36.0" y="984.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="36.0" dy="0">Weight backdoors and self-generated drift use C4 or C7 only when Stage 1 included them. Otherwise G1 records a waiver.</tspan></text>
<text x="36.0" y="1008.0" font-size="13" fill="#5D6D7E" text-anchor="start"><tspan x="36.0" dy="0">Empty successful-attack sets leave detection coverage undefined. They are not drawn here as a success.</tspan></text>
</svg>
