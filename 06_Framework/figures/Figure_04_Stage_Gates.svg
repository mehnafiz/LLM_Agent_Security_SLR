<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860">
<rect width="1320" height="860" fill="#ffffff"/>
<style>text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#1A2332"/></marker><marker id="bl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#2B6CB0"/></marker><marker id="pu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#6B46C1"/></marker><marker id="rd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#C53030"/></marker><marker id="gn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#276749"/></marker></defs>
<rect x="0" y="0" width="1320" height="40" rx="0" fill="#1B365D" stroke="#1B365D" stroke-width="1.5"/><text x="16" y="26" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Fig. 4.   G1–G4 stage-gate verification</text><rect x="16" y="56" width="310" height="360" rx="8" fill="#E7F1FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="32" y="88" font-size="20" font-weight="700" fill="#1A2332" text-anchor="start">G1</text><text x="86" y="88" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">After Stage 2</text><text x="32" y="116" font-size="15" font-weight="700" fill="#1A2332" text-anchor="start">Preparation</text><text x="32" y="168" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Name or waive every surface.</text><text x="32" y="214" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Adversary, goal, or a waiver.</text><text x="32" y="270" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Fail returns to Stage 2.</text><line x1="326" y1="220" x2="338" y2="220" stroke="#6B46C1" stroke-width="1.7" marker-end="url(#pu)"/><rect x="342" y="56" width="310" height="360" rx="8" fill="#F4E9FB" stroke="#6B46C1" stroke-width="1.5"/><text x="358" y="88" font-size="20" font-weight="700" fill="#1A2332" text-anchor="start">G2</text><text x="412" y="88" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">After Stage 5</text><text x="358" y="116" font-size="15" font-weight="700" fill="#1A2332" text-anchor="start">Trace</text><text x="358" y="168" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">A scored case needs a complete trace.</text><text x="358" y="214" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Logged apart. Not a passing trace.</text><text x="358" y="270" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Fail returns to Stage 5.</text><line x1="652" y1="220" x2="664" y2="220" stroke="#6B46C1" stroke-width="1.7" marker-end="url(#pu)"/><rect x="668" y="56" width="310" height="360" rx="8" fill="#FFF6EA" stroke="#C05621" stroke-width="1.5"/><text x="684" y="88" font-size="20" font-weight="700" fill="#1A2332" text-anchor="start">G3</text><text x="738" y="88" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">After Stage 6</text><text x="684" y="116" font-size="15" font-weight="700" fill="#1A2332" text-anchor="start">Score</text><text x="684" y="168" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Each number cites a field.</text><text x="684" y="214" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Task success uses the same pairs.</text><text x="684" y="270" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Carrier wrong: Stage 4. Arithmetic: Stage 6.</text><line x1="978" y1="220" x2="990" y2="220" stroke="#6B46C1" stroke-width="1.7" marker-end="url(#pu)"/><rect x="994" y="56" width="310" height="360" rx="8" fill="#E7F6EC" stroke="#276749" stroke-width="1.5"/><text x="1010" y="88" font-size="20" font-weight="700" fill="#1A2332" text-anchor="start">G4</text><text x="1064" y="88" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">After Stage 8</text><text x="1010" y="116" font-size="15" font-weight="700" fill="#1A2332" text-anchor="start">Rerun</text><text x="1010" y="168" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Class, both task columns, leftovers.</text><text x="1010" y="214" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">A changed-attack run, or a waiver.</text><text x="1010" y="270" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Fail returns to Stage 8.</text><text x="16" y="440" font-size="12.5" font-weight="400" fill="#3D4A5C" text-anchor="start">Highlighted stages decide a gate. A runner failure is not a defense success and is outside every denominator. “Not monitored” is not a failure.</text><rect x="16" y="456" width="122" height="36" rx="8" fill="#F7F9FC" stroke="#C5CED6" stroke-width="1.5"/><text x="77" y="479" font-size="11" font-weight="500" fill="#1A2332" text-anchor="middle">1 Identify</text><rect x="146" y="456" width="122" height="36" rx="8" fill="#F4E9FB" stroke="#6B46C1" stroke-width="1.5"/><text x="207" y="479" font-size="11" font-weight="700" fill="#1A2332" text-anchor="middle">2 Threat model</text><rect x="276" y="456" width="122" height="36" rx="8" fill="#F7F9FC" stroke="#C5CED6" stroke-width="1.5"/><text x="337" y="479" font-size="11" font-weight="500" fill="#1A2332" text-anchor="middle">3 Requirements</text><rect x="406" y="456" width="122" height="36" rx="8" fill="#F7F9FC" stroke="#C5CED6" stroke-width="1.5"/><text x="467" y="479" font-size="11" font-weight="500" fill="#1A2332" text-anchor="middle">4 Tests</text><rect x="536" y="456" width="122" height="36" rx="8" fill="#F4E9FB" stroke="#6B46C1" stroke-width="1.5"/><text x="597" y="479" font-size="11" font-weight="700" fill="#1A2332" text-anchor="middle">5 Run</text><rect x="666" y="456" width="122" height="36" rx="8" fill="#F4E9FB" stroke="#6B46C1" stroke-width="1.5"/><text x="727" y="479" font-size="11" font-weight="700" fill="#1A2332" text-anchor="middle">6 Score</text><rect x="796" y="456" width="122" height="36" rx="8" fill="#F7F9FC" stroke="#C5CED6" stroke-width="1.5"/><text x="857" y="479" font-size="11" font-weight="500" fill="#1A2332" text-anchor="middle">7 Detect</text><rect x="926" y="456" width="122" height="36" rx="8" fill="#F4E9FB" stroke="#6B46C1" stroke-width="1.5"/><text x="987" y="479" font-size="11" font-weight="700" fill="#1A2332" text-anchor="middle">8 Mitigate</text><rect x="1056" y="456" width="122" height="36" rx="8" fill="#F7F9FC" stroke="#C5CED6" stroke-width="1.5"/><text x="1117" y="479" font-size="11" font-weight="500" fill="#1A2332" text-anchor="middle">9 Recover</text><rect x="1186" y="456" width="122" height="36" rx="8" fill="#F7F9FC" stroke="#C5CED6" stroke-width="1.5"/><text x="1247" y="479" font-size="11" font-weight="500" fill="#1A2332" text-anchor="middle">10 Report</text><rect x="16" y="512" width="1288" height="332" rx="8" fill="#F7F9FC" stroke="#D5DEE8" stroke-width="1.5"/><text x="660" y="544" font-size="16" font-weight="700" fill="#1A2332" text-anchor="middle">What a pass means</text><polygon points="660,570 760,640 660,710 560,640" fill="#ffffff" stroke="#1B365D" stroke-width="1.6"/><text x="660" y="628" font-size="12" font-weight="700" fill="#1A2332" text-anchor="middle">Gate-specific</text><text x="660" y="646" font-size="12" font-weight="700" fill="#1A2332" text-anchor="middle">criteria met?</text><line x1="560" y1="640" x2="470" y2="640" stroke="#C53030" stroke-width="1.7" marker-end="url(#rd)"/><line x1="760" y1="640" x2="850" y2="640" stroke="#276749" stroke-width="1.7" marker-end="url(#gn)"/><rect x="32" y="600" width="420" height="200" rx="8" fill="#FDECEC" stroke="#D64545" stroke-width="1.5"/><text x="48" y="632" font-size="15" font-weight="700" fill="#9B2C2C" text-anchor="start">No  ·  evidence is missing</text><text x="48" y="668" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">G1 returns to Stage 2. G2 to Stage 5.</text><text x="48" y="694" font-size="13" font-weight="500" fill="#1A2332" text-anchor="start">G3: Stage 4 if the check is wrong; Stage 6 if the arithmetic is.</text><text x="48" y="720" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">G4 returns to Stage 8.</text><text x="48" y="756" font-size="13" font-weight="400" fill="#9B2C2C" text-anchor="start">The return does not end in “secure.”</text><rect x="868" y="600" width="420" height="200" rx="8" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="884" y="632" font-size="15" font-weight="700" fill="#276749" text-anchor="start">Yes  ·  evidence is present</text><text x="884" y="668" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">The record may continue.</text><text x="884" y="694" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Stage 9 restores, or lists a residual.</text><text x="884" y="720" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Stage 10 files the release record.</text><text x="884" y="756" font-size="13" font-weight="400" fill="#276749" text-anchor="start">A pass is not a finding of security.</text><text x="48" y="824" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">A waiver is not a pass. Stages 9 and 10 are not gates.</text>
</svg>
