<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1180" viewBox="0 0 1560 1180">
<rect width="100%" height="100%" fill="#FFFFFF"/>
<style>text { font-family: Helvetica, Arial, sans-serif; }</style>

        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#1C2833"/>
          </marker>
          <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#922B21"/>
          </marker>
          <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#196F3D"/>
          </marker>
          <marker id="arrOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#B9770E"/>
          </marker>
          <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#1A5276"/>
          </marker>
        </defs>
        
<text x="36.0" y="34.0" font-size="20" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="36.0" dy="0">Figure 4. Stage-gate decisions</tspan></text>
<text x="36.0" y="58.0" font-size="13" fill="#5D6D7E" text-anchor="start"><tspan x="36.0" dy="0">A pass moves down. A fail moves right, back to the stage that can supply the missing evidence. These checks are not runtime interlocks.</tspan></text>
<rect x="48.0" y="88.0" width="860.0" height="72.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="68.0" y="118.0" font-size="16" fill="#1A5276" text-anchor="start" font-weight="600"><tspan x="68.0" dy="0">Stage 2</tspan></text>
<text x="68.0" y="142.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="68.0" dy="0">Write the surface catalog: adversary, goal, and precondition.</tspan></text>
<rect x="48.0" y="172.0" width="860.0" height="78.0" rx="8" fill="#FEF5E7" stroke="#B9770E" stroke-width="1.6"/>
<text x="68.0" y="200.0" font-size="16" fill="#B9770E" text-anchor="start" font-weight="600"><tspan x="68.0" dy="0">Decision  G1</tspan></text>
<text x="68.0" y="226.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="68.0" dy="0">Every surface is covered or waived in writing.</tspan></text>
<line x1="908.0" y1="211.0" x2="980.0" y2="211.0" stroke="#922B21" stroke-width="1.6" fill="none" marker-end="url(#arrRed)"/>
<rect x="988.0" y="172.0" width="536.0" height="78.0" rx="8" fill="#FDEDEC" stroke="#922B21" stroke-width="1.6"/>
<text x="1004.0" y="196.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="1004.0" dy="0">Fail</tspan></text>
<text x="1004.0" y="216.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="1004.0" dy="0">Return to Stage 2. Do not write tests.</tspan></text>
<rect x="48.0" y="262.0" width="860.0" height="72.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="68.0" y="292.0" font-size="16" fill="#1A5276" text-anchor="start" font-weight="600"><tspan x="68.0" dy="0">Stages 3–5</tspan></text>
<text x="68.0" y="316.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="68.0" dy="0">Write requirement pairs, declare trace checks, and run under instrumentation.</tspan></text>
<rect x="48.0" y="346.0" width="860.0" height="78.0" rx="8" fill="#FEF5E7" stroke="#B9770E" stroke-width="1.6"/>
<text x="68.0" y="374.0" font-size="16" fill="#B9770E" text-anchor="start" font-weight="600"><tspan x="68.0" dy="0">Decision  G2</tspan></text>
<text x="68.0" y="400.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="68.0" dy="0">Every case has a tool-level trace, or a recorded runner failure.</tspan></text>
<line x1="908.0" y1="385.0" x2="980.0" y2="385.0" stroke="#922B21" stroke-width="1.6" fill="none" marker-end="url(#arrRed)"/>
<rect x="988.0" y="346.0" width="536.0" height="78.0" rx="8" fill="#FDEDEC" stroke="#922B21" stroke-width="1.6"/>
<text x="1004.0" y="370.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="1004.0" dy="0">Fail</tspan></text>
<text x="1004.0" y="390.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="1004.0" dy="0">Return to Stage 5. Do not score a missing log.</tspan></text>
<rect x="48.0" y="436.0" width="860.0" height="72.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="68.0" y="466.0" font-size="16" fill="#1A5276" text-anchor="start" font-weight="600"><tspan x="68.0" dy="0">Stage 6</tspan></text>
<text x="68.0" y="490.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="68.0" dy="0">Compute each number only from the pre-declared trace check.</tspan></text>
<rect x="48.0" y="520.0" width="860.0" height="78.0" rx="8" fill="#FEF5E7" stroke="#B9770E" stroke-width="1.6"/>
<text x="68.0" y="548.0" font-size="16" fill="#B9770E" text-anchor="start" font-weight="600"><tspan x="68.0" dy="0">Decision  G3</tspan></text>
<text x="68.0" y="574.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="68.0" dy="0">Each number cites a trace field and a requirement identifier.</tspan></text>
<line x1="908.0" y1="559.0" x2="980.0" y2="559.0" stroke="#922B21" stroke-width="1.6" fill="none" marker-end="url(#arrRed)"/>
<rect x="988.0" y="520.0" width="536.0" height="78.0" rx="8" fill="#FDEDEC" stroke="#922B21" stroke-width="1.6"/>
<text x="1004.0" y="544.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="1004.0" dy="0">Fail</tspan></text>
<text x="1004.0" y="564.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="1004.0" dy="0">Wrong check or carrier: return to Stage 4.</tspan><tspan x="1004.0" dy="16">Arithmetic only: return to Stage 6.</tspan></text>
<rect x="48.0" y="610.0" width="860.0" height="72.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="68.0" y="640.0" font-size="16" fill="#1A5276" text-anchor="start" font-weight="600"><tspan x="68.0" dy="0">Stages 7–8</tspan></text>
<text x="68.0" y="664.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="68.0" dy="0">Mark detection coverage. Apply named controls and rerun.</tspan></text>
<rect x="48.0" y="694.0" width="860.0" height="78.0" rx="8" fill="#FEF5E7" stroke="#B9770E" stroke-width="1.6"/>
<text x="68.0" y="722.0" font-size="16" fill="#B9770E" text-anchor="start" font-weight="600"><tspan x="68.0" dy="0">Decision  G4</tspan></text>
<text x="68.0" y="748.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="68.0" dy="0">Class, observation point, task-success change, leftovers, and rerun or waiver.</tspan></text>
<line x1="908.0" y1="733.0" x2="980.0" y2="733.0" stroke="#922B21" stroke-width="1.6" fill="none" marker-end="url(#arrRed)"/>
<rect x="988.0" y="694.0" width="536.0" height="78.0" rx="8" fill="#FDEDEC" stroke="#922B21" stroke-width="1.6"/>
<text x="1004.0" y="718.0" font-size="12" fill="#922B21" text-anchor="start" font-weight="600"><tspan x="1004.0" dy="0">Fail</tspan></text>
<text x="1004.0" y="738.0" font-size="13" fill="#1C2833" text-anchor="start"><tspan x="1004.0" dy="0">Return to Stage 8. A control without a rerun is</tspan><tspan x="1004.0" dy="16">unfinished.</tspan></text>
<rect x="48.0" y="784.0" width="860.0" height="72.0" rx="8" fill="#EAF2F8" stroke="#1A5276" stroke-width="1.6"/>
<text x="68.0" y="814.0" font-size="16" fill="#1A5276" text-anchor="start" font-weight="600"><tspan x="68.0" dy="0">Stages 9–10</tspan></text>
<text x="68.0" y="838.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="68.0" dy="0">Restore the baseline or list the residual. Freeze the release record.</tspan></text>
<path d="M 48 820 L 22 820 L 22 124 L 48 124" fill="none" stroke="#B9770E" stroke-width="1.6" marker-end="url(#arrOrange)"/>
<text x="14" y="470" font-size="12" fill="#B9770E" font-weight="600" text-anchor="middle" transform="rotate(-90 14 470)">Next change returns to Stage 2</text>
<rect x="48.0" y="1068.0" width="1476.0" height="78.0" rx="8" fill="#F4F6F7" stroke="#5D6D7E" stroke-width="1.6"/>
<text x="64.0" y="1098.0" font-size="14" fill="#1C2833" text-anchor="start" font-weight="600"><tspan x="64.0" dy="0">A waiver is written in the Stage 10 record. A waiver is not a pass.</tspan></text>
<text x="64.0" y="1124.0" font-size="14" fill="#1C2833" text-anchor="start"><tspan x="64.0" dy="0">Stage 9 has no fifth gate. An irreversible effect is a listed residual, not a failed decision and not a clean recovery.</tspan></text>
</svg>
