<style>text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#1A2332"/></marker><marker id="bl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#2B6CB0"/></marker><marker id="pu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#6B46C1"/></marker><marker id="rd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#C53030"/></marker><marker id="gn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#276749"/></marker></defs>
<rect x="0" y="0" width="1320" height="40" rx="0" fill="#1B365D" stroke="#1B365D" stroke-width="1.5"/><text x="16" y="26" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Fig. 3.   Threat model and attack surface</text><rect x="16" y="56" width="360" height="620" rx="8" fill="#FDECEC" stroke="#D64545" stroke-width="1.5"/><text x="32" y="84" font-size="16" font-weight="700" fill="#1A2332" text-anchor="start">Threat actors</text><rect x="32" y="104" width="328" height="78" rx="8" fill="#ffffff" stroke="#D64545" stroke-width="1.5"/><text x="48" y="136" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Content injector</text><text x="48" y="158" font-size="12.5" font-weight="400" fill="#3D4A5C" text-anchor="start">Places text the agent will read</text><rect x="32" y="194" width="328" height="78" rx="8" fill="#ffffff" stroke="#D64545" stroke-width="1.5"/><text x="48" y="226" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Instruction adversary</text><text x="48" y="248" font-size="12.5" font-weight="400" fill="#3D4A5C" text-anchor="start">Only if the check is a tool effect</text><rect x="32" y="284" width="328" height="78" rx="8" fill="#ffffff" stroke="#D64545" stroke-width="1.5"/><text x="48" y="316" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Tool publisher</text><text x="48" y="338" font-size="12.5" font-weight="400" fill="#3D4A5C" text-anchor="start">Manual, code, or both, if installed</text><rect x="32" y="374" width="328" height="78" rx="8" fill="#ffffff" stroke="#D64545" stroke-width="1.5" stroke-dasharray="5 3.5"/><text x="48" y="406" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Peer agent</text><text x="48" y="428" font-size="12.5" font-weight="400" fill="#3D4A5C" text-anchor="start">Waived when no peer is registered</text><rect x="32" y="464" width="328" height="78" rx="8" fill="#ffffff" stroke="#D64545" stroke-width="1.5" stroke-dasharray="5 3.5"/><text x="48" y="496" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Model or trace supplier</text><text x="48" y="518" font-size="12.5" font-weight="400" fill="#3D4A5C" text-anchor="start">Only if that pipeline is in scope</text><rect x="32" y="554" width="328" height="78" rx="8" fill="#ffffff" stroke="#D64545" stroke-width="1.5" stroke-dasharray="5 3.5"/><text x="48" y="586" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Internal evolution</text><text x="48" y="608" font-size="12.5" font-weight="400" fill="#3D4A5C" text-anchor="start">Only if the system updates itself</text><rect x="392" y="56" width="560" height="620" rx="8" fill="#F7F4FF" stroke="#6B46C1" stroke-width="1.5" stroke-dasharray="5 3.5"/><text x="672" y="84" font-size="16" font-weight="700" fill="#1A2332" text-anchor="middle">Trust boundary</text><rect x="412" y="100" width="520" height="200" rx="8" fill="#E7F1FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="672" y="120" font-size="14" font-weight="700" fill="#1A365D" text-anchor="middle">System under test</text><text x="672" y="140" font-size="12" font-weight="400" fill="#2A4365" text-anchor="middle">User instruction enters the agent</text><rect x="576" y="150" width="192" height="36" rx="8" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5" stroke-dasharray="5 3.5"/><text x="672" y="173" font-size="12" font-weight="700" fill="#1A2332" text-anchor="middle">Memory, if registered</text><rect x="424" y="202" width="118" height="50" rx="8" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5"/><text x="483" y="224" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">Tools</text><text x="483" y="240" font-size="11" font-weight="400" fill="#3D4A5C" text-anchor="middle">Calls</text><rect x="576" y="202" width="192" height="50" rx="8" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5"/><text x="672" y="224" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">Agent</text><text x="672" y="240" font-size="11" font-weight="400" fill="#3D4A5C" text-anchor="middle">Plans</text><rect x="802" y="202" width="118" height="50" rx="8" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5" stroke-dasharray="5 3.5"/><text x="861" y="224" font-size="13" font-weight="700" fill="#1A2332" text-anchor="middle">Peer</text><text x="861" y="240" font-size="11" font-weight="400" fill="#3D4A5C" text-anchor="middle">If registered</text><path d="M576 227 H548" fill="none" stroke="#2B6CB0" stroke-width="1.7" marker-end="url(#bl)"/><path d="M768 227 H796" fill="none" stroke="#2B6CB0" stroke-width="1.7" stroke-dasharray="5 3.5" marker-end="url(#bl)"/><path d="M672 202 V190" fill="none" stroke="#2B6CB0" stroke-width="1.7" stroke-dasharray="5 3.5" marker-end="url(#bl)"/><text x="672" y="276" font-size="11" font-weight="400" fill="#553C9A" text-anchor="middle">Separate links, not a chain. Dashed only if Stage 1 registers them. TB5 is not this box.</text><rect x="412" y="312" width="520" height="44" rx="6" fill="#ffffff" stroke="#6B46C1" stroke-width="1.5"/><text x="424" y="330" font-size="12" font-weight="500" fill="#1A2332" text-anchor="start">TB1  Instruction and untrusted data are separate channels.</text><text x="424" y="346" font-size="12" font-weight="500" fill="#1A2332" text-anchor="start">Direct instructions remain subject to the task allow-list.</text><rect x="412" y="364" width="520" height="44" rx="6" fill="#ffffff" stroke="#6B46C1" stroke-width="1.5"/><text x="424" y="392" font-size="12.5" font-weight="500" fill="#1A2332" text-anchor="start">TB2   Description, code, and permission are separate</text><rect x="412" y="416" width="520" height="44" rx="6" fill="#ffffff" stroke="#6B46C1" stroke-width="1.5"/><text x="424" y="444" font-size="12.5" font-weight="500" fill="#1A2332" text-anchor="start">TB3   Stored memory is data until a policy promotes it</text><rect x="412" y="468" width="520" height="44" rx="6" fill="#ffffff" stroke="#6B46C1" stroke-width="1.5"/><text x="424" y="496" font-size="12.5" font-weight="500" fill="#1A2332" text-anchor="start">TB4   A peer cannot grant a tool the user did not</text><rect x="412" y="520" width="520" height="44" rx="6" fill="#ffffff" stroke="#6B46C1" stroke-width="1.5"/><text x="424" y="548" font-size="12.5" font-weight="500" fill="#1A2332" text-anchor="start">TB5   The oracle is the trace, not the model’s claim</text><rect x="968" y="56" width="336" height="620" rx="8" fill="#FFF6EA" stroke="#E09A2B" stroke-width="1.5"/><text x="984" y="84" font-size="16" font-weight="700" fill="#1A2332" text-anchor="start">Attack surfaces</text><rect x="984" y="108" width="304" height="60" rx="8" fill="#ffffff" stroke="#E09A2B" stroke-width="1.5"/><text x="1000" y="144" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Untrusted content</text><rect x="984" y="184" width="304" height="60" rx="8" fill="#ffffff" stroke="#E09A2B" stroke-width="1.5"/><text x="1000" y="220" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Tool description</text><rect x="984" y="260" width="304" height="60" rx="8" fill="#ffffff" stroke="#E09A2B" stroke-width="1.5"/><text x="1000" y="296" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Tool implementation</text><rect x="984" y="336" width="304" height="60" rx="8" fill="#ffffff" stroke="#E09A2B" stroke-width="1.5"/><text x="1000" y="372" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Tool execution</text><rect x="984" y="412" width="304" height="60" rx="8" fill="#ffffff" stroke="#E09A2B" stroke-width="1.5"/><text x="1000" y="448" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Memory read and write</text><rect x="984" y="488" width="304" height="60" rx="8" fill="#ffffff" stroke="#E09A2B" stroke-width="1.5"/><text x="1000" y="524" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Peer message, if in scope</text><rect x="984" y="564" width="304" height="60" rx="8" fill="#ffffff" stroke="#E09A2B" stroke-width="1.5"/><text x="1000" y="600" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Instruction channel</text><rect x="16" y="692" width="1288" height="152" rx="8" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="32" y="720" font-size="16" font-weight="700" fill="#1A2332" text-anchor="start">Protected assets</text><rect x="32" y="740" width="164" height="40" rx="8" fill="#ffffff" stroke="#2F8F4E" stroke-width="1.5"/><text x="114" y="766" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">User data</text><rect x="212" y="740" width="164" height="40" rx="8" fill="#ffffff" stroke="#2F8F4E" stroke-width="1.5"/><text x="294" y="766" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">Tool effect</text><rect x="392" y="740" width="164" height="40" rx="8" fill="#ffffff" stroke="#2F8F4E" stroke-width="1.5"/><text x="474" y="766" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">Memory</text><rect x="572" y="740" width="164" height="40" rx="8" fill="#ffffff" stroke="#2F8F4E" stroke-width="1.5"/><text x="654" y="766" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">Peer agents</text><rect x="752" y="740" width="164" height="40" rx="8" fill="#ffffff" stroke="#2F8F4E" stroke-width="1.5"/><text x="834" y="766" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">User task</text><text x="32" y="812" font-size="12.5" font-weight="400" fill="#276749" text-anchor="start">Waiver is a scope decision, not a surface: used when tool code is outside the register. An attempt is not the scored effect.</text>
</svg>
