<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860">
<rect width="1320" height="860" fill="#ffffff"/>
<style>text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#1A2332"/></marker><marker id="bl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#2B6CB0"/></marker><marker id="pu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#6B46C1"/></marker><marker id="rd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#C53030"/></marker><marker id="gn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#276749"/></marker></defs>
<rect x="0" y="0" width="1320" height="40" rx="0" fill="#1B365D" stroke="#1B365D" stroke-width="1.5"/><text x="16" y="26" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Fig. 2.   Agent loop, attack surfaces, and controls</text><rect x="16" y="56" width="820" height="788" rx="8" fill="#F7F9FC" stroke="#D5DEE8" stroke-width="1.5"/><text x="32" y="84" font-size="15" font-weight="700" fill="#1A2332" text-anchor="start">Runtime loop  ·  gates are not on this path</text><circle cx="430" cy="455" r="168" fill="none" stroke="#D6E4F0" stroke-width="10"/><circle cx="430" cy="455" r="52" fill="#E7F1FB" stroke="#2B6CB0" stroke-width="1.6"/><text x="430" y="449" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">Agent</text><text x="430" y="469" font-size="14" font-weight="700" fill="#1A2332" text-anchor="middle">loop</text><rect x="306.8271061519557" y="263.552297493949" width="188" height="52" rx="10" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5"/><text x="318.8271061519557" y="285.552297493949" font-size="13.5" font-weight="700" fill="#1A2332" text-anchor="start">1  Instruction</text><text x="318.8271061519557" y="303.552297493949" font-size="12" font-weight="400" fill="#3D4A5C" text-anchor="start">User task</text><rect x="484.3351956002997" y="350.12877745197034" width="188" height="52" rx="10" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5"/><text x="496.3351956002997" y="372.12877745197034" font-size="13.5" font-weight="700" fill="#1A2332" text-anchor="start">2  Planning</text><text x="496.3351956002997" y="390.12877745197034" font-size="12" font-weight="400" fill="#3D4A5C" text-anchor="start">C5 vs the later call</text><rect x="448.41394186828825" y="553.8483306802023" width="188" height="52" rx="10" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5"/><text x="460.41394186828825" y="575.8483306802023" font-size="13.5" font-weight="700" fill="#1A2332" text-anchor="start">3  Select, then execute</text><text x="460.41394186828825" y="593.8483306802023" font-size="12" font-weight="400" fill="#3D4A5C" text-anchor="start">C3 select · C2, C4 run</text><rect x="198.38245655944934" y="525.3608413069758" width="188" height="52" rx="10" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5"/><text x="210.38245655944934" y="547.3608413069758" font-size="13.5" font-weight="700" fill="#1A2332" text-anchor="start">4  Tool result</text><text x="210.38245655944934" y="565.3608413069758" font-size="12" font-weight="400" fill="#3D4A5C" text-anchor="start">C1: data, not instruction</text><rect x="168.63929072058676" y="414.3578352183934" width="188" height="52" rx="10" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5" stroke-dasharray="5 3.5"/><text x="180.63929072058676" y="436.3578352183934" font-size="13.5" font-weight="700" fill="#1A2332" text-anchor="start">5  Memory</text><text x="180.63929072058676" y="454.3578352183934" font-size="12" font-weight="400" fill="#3D4A5C" text-anchor="start">C7 write, then read</text><line x1="481.7185703188807" y1="300.0732050168869" x2="497.4437314333747" y2="365.60786992903246" stroke="#2B6CB0" stroke-width="1.7" marker-end="url(#bl)"/><line x1="562.706859610276" y1="399.7641635242633" x2="558.042277858312" y2="556.2129446079092" stroke="#2B6CB0" stroke-width="1.7" marker-end="url(#bl)"/><line x1="452.9924748573954" y1="577.1314535497725" x2="381.8039235703422" y2="554.0777184374056" stroke="#2B6CB0" stroke-width="1.7" marker-end="url(#bl)"/><path d="M198 551 H90 V376 H484" fill="none" stroke="#2B6CB0" stroke-width="1.7" marker-end="url(#bl)"/><text x="96" y="364.12877745197034" font-size="13" font-weight="700" fill="#2A4365" text-anchor="start">Re-plan</text><path d="M292 525 L263 466" fill="none" stroke="#2B6CB0" stroke-width="1.7" stroke-dasharray="5 3.5" marker-end="url(#bl)"/><text x="430" y="701" font-size="13" font-weight="600" fill="#2A4365" text-anchor="middle">Task end leaves the loop</text><rect x="28" y="108" width="200" height="64" rx="8" fill="#FFF6EA" stroke="#E09A2B" stroke-width="1.5"/><text x="40" y="132" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Configuration</text><text x="40" y="154" font-size="12" font-weight="400" fill="#3D4A5C" text-anchor="start">C3 only. C4 is on execution.</text><rect x="28" y="188" width="170" height="58" rx="8" fill="#ffffff" stroke="#2B6CB0" stroke-width="1.5" stroke-dasharray="5 3.5"/><text x="40" y="210" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Peer</text><text x="40" y="230" font-size="12.5" font-weight="400" fill="#3D4A5C" text-anchor="start">If registered. C9.</text><rect x="28" y="760" width="250" height="68" rx="8" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="40" y="784" font-size="14" font-weight="700" fill="#1A2332" text-anchor="start">Commit and recovery</text><text x="40" y="806" font-size="12" font-weight="400" fill="#276749" text-anchor="start">C6 at commit. C10 reruns after it.</text><rect x="852" y="56" width="452" height="370" rx="8" fill="#FDECEC" stroke="#D64545" stroke-width="1.5"/><text x="868" y="84" font-size="16" font-weight="700" fill="#1A2332" text-anchor="start">Attack surfaces</text><text x="868" y="106" font-size="13" font-weight="400" fill="#9B2C2C" text-anchor="start">An attempt is not yet the scored effect.</text><text x="868" y="140" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">Untrusted content: page, mail, tool result</text><text x="868" y="174" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">Tool description, distinct from tool code</text><text x="868" y="208" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">Tool implementation</text><text x="868" y="242" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">Tool execution: name, arguments, destination</text><text x="868" y="276" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">Memory write, then a later read</text><text x="868" y="310" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">Peer message, only if a peer is registered</text><text x="868" y="344" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">Instruction channel, only as a tool effect</text><text x="868" y="392" font-size="12.5" font-weight="400" fill="#9B2C2C" text-anchor="start">Waived if tool code is outside the registered scope.</text><rect x="852" y="442" width="452" height="402" rx="8" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="868" y="470" font-size="16" font-weight="700" fill="#1A2332" text-anchor="start">Controls at those points</text><text x="868" y="492" font-size="13" font-weight="400" fill="#276749" text-anchor="start">Design controls. None has been measured here.</text><text x="868" y="524" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">C1   Keep untrusted text in a data channel</text><text x="868" y="556" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">C2   Allow-list before the effect commits</text><text x="868" y="588" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">C3   Pin the manual: configuration and selection</text><text x="868" y="620" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">C4   Pin the implementation, at execution</text><text x="868" y="652" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">C5   Detect a plan change. It does not stop the call</text><text x="868" y="684" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">C6   Flag at commit, then block or approve</text><text x="868" y="716" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">C7 memory. C8 is the outbound call after a read</text><text x="868" y="748" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">C9   Peer-caused calls, scored apart</text><text x="868" y="780" font-size="13.5" font-weight="500" fill="#1A2332" text-anchor="start">C10   Restore, then rerun. Not a proof</text>
</svg>
