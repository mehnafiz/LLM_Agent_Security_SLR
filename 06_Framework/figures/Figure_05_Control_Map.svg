<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="860" viewBox="0 0 1320 860">
<rect width="1320" height="860" fill="#ffffff"/>
<style>text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#1A2332"/></marker><marker id="bl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#2B6CB0"/></marker><marker id="pu" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#6B46C1"/></marker><marker id="rd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#C53030"/></marker><marker id="gn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5 L8 5 L1 8.5 Z" fill="#276749"/></marker></defs>
<rect x="0" y="0" width="1320" height="40" rx="0" fill="#1B365D" stroke="#1B365D" stroke-width="1.5"/><text x="16" y="26" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Fig. 5.   Threat, control, evidence, and metric</text><rect x="16" y="56" width="1288" height="36" rx="6" fill="#1B365D" stroke="#1B365D" stroke-width="1.5"/><text x="28" y="80" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">ID</text><text x="90" y="80" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">Threat</text><text x="300" y="80" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">Point</text><text x="480" y="80" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">Class</text><text x="720" y="80" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">Evidence the check uses</text><text x="1080" y="80" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="start">Metric</text><rect x="16" y="100" width="1288" height="58" rx="6" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="28" y="136" font-size="14" font-weight="600" fill="#1A2332" text-anchor="start">C1</text><text x="90" y="136" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Indirect injection</text><text x="300" y="136" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Tool result</text><text x="480" y="136" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Prevent</text><text x="720" y="136" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Data channel kept separate</text><text x="1080" y="136" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">AS, UA</text><rect x="16" y="164" width="1288" height="58" rx="6" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="28" y="200" font-size="14" font-weight="600" fill="#1A2332" text-anchor="start">C2</text><text x="90" y="200" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Unauthorized tool</text><text x="300" y="200" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Before commit</text><text x="480" y="200" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Prevent</text><text x="720" y="200" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Name, arguments, destination</text><text x="1080" y="200" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">AS</text><rect x="16" y="228" width="1288" height="58" rx="6" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="28" y="264" font-size="14" font-weight="600" fill="#1A2332" text-anchor="start">C3</text><text x="90" y="264" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Poisoned manual</text><text x="300" y="264" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Selection</text><text x="480" y="264" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Prevent</text><text x="720" y="264" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Pin and the selected name</text><text x="1080" y="264" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">AS</text><rect x="16" y="292" width="1288" height="58" rx="6" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="28" y="328" font-size="14" font-weight="600" fill="#1A2332" text-anchor="start">C4</text><text x="90" y="328" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Tool-code effect</text><text x="300" y="328" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Execution</text><text x="480" y="328" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Prevent</text><text x="720" y="316" font-size="12" font-weight="500" fill="#1A2332" text-anchor="start">If in scope: hash and permission are logged.</text><text x="720" y="334" font-size="12" font-weight="500" fill="#1A2332" text-anchor="start">If waived: the scope register records it. Not a verification.</text><text x="1080" y="328" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">AS</text><rect x="16" y="356" width="1288" height="58" rx="6" fill="#F4E9FB" stroke="#6B46C1" stroke-width="1.5"/><text x="28" y="392" font-size="14" font-weight="600" fill="#1A2332" text-anchor="start">C5</text><text x="90" y="392" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Plan changed</text><text x="300" y="392" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Planning</text><text x="480" y="392" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Detect</text><text x="720" y="392" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Flag. The plan is not an oracle</text><text x="1080" y="392" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">DC</text><rect x="16" y="420" width="1288" height="58" rx="6" fill="#FFF6EA" stroke="#C05621" stroke-width="1.5"/><text x="28" y="456" font-size="14" font-weight="600" fill="#1A2332" text-anchor="start">C6</text><text x="90" y="456" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">At commit</text><text x="300" y="456" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Commit</text><text x="480" y="456" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Detect, respond</text><text x="720" y="456" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Flag and the committed flag</text><text x="1080" y="456" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">DC, AS, TS</text><rect x="16" y="484" width="1288" height="58" rx="6" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="28" y="520" font-size="14" font-weight="600" fill="#1A2332" text-anchor="start">C7</text><text x="90" y="520" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Memory poison</text><text x="300" y="520" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Write, later read</text><text x="480" y="520" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Prevent, detect</text><text x="720" y="520" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Operation, entry, provenance</text><text x="1080" y="520" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">AS</text><rect x="16" y="548" width="1288" height="58" rx="6" fill="#E7F6EC" stroke="#2F8F4E" stroke-width="1.5"/><text x="28" y="584" font-size="14" font-weight="600" fill="#1A2332" text-anchor="start">C8</text><text x="90" y="584" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Memory disclosure</text><text x="300" y="584" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Outbound call</text><text x="480" y="584" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Prevent</text><text x="720" y="584" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Destination</text><text x="1080" y="584" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">AS</text><rect x="16" y="612" width="1288" height="58" rx="6" fill="#FFF6EA" stroke="#C05621" stroke-width="1.5"/><text x="28" y="648" font-size="14" font-weight="600" fill="#1A2332" text-anchor="start">C9</text><text x="90" y="648" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Peer-caused call</text><text x="300" y="648" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Peer exchange</text><text x="480" y="648" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Prevent, detect, respond</text><text x="720" y="648" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Receiver’s call, scored apart</text><text x="1080" y="648" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">AS</text><rect x="16" y="676" width="1288" height="58" rx="6" fill="#E7F1FB" stroke="#2B6CB0" stroke-width="1.5"/><text x="28" y="712" font-size="14" font-weight="600" fill="#1A2332" text-anchor="start">C10</text><text x="90" y="712" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Residual state</text><text x="300" y="712" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">After commit</text><text x="480" y="712" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Recover</text><text x="720" y="712" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">Restore log, then a separate rerun</text><text x="1080" y="712" font-size="14" font-weight="500" fill="#1A2332" text-anchor="start">LR set; TS on rerun</text><text x="16" y="768" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">Green: prevent. Purple: detect only. Orange includes a response. Blue: recover. C5 does not stop the call.</text><text x="16" y="790" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">DC is undefined when A_s is empty or no detector ran. FN is undefined when A_s is empty. FP is undefined when no detector ran.</text><text x="16" y="812" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">“Not monitored” is not a false-positive rate of zero. LR is the leftover set. TS on C10 is the recovery rerun, a different measurement.</text><text x="16" y="834" font-size="13" font-weight="400" fill="#3D4A5C" text-anchor="start">CAC is the G4 changed-attack cell, or a waiver, not a row above. No threshold, no composite, and no row has been measured.</text>
</svg>
